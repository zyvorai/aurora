name: release-images

# Tag vX.Y.Z -> multi-arch images on GHCR (aurora-api, aurora-workers, aurora-web), keyless-signed.
# The web image is portable: it calls a relative /api/v1 and proxies to API_INTERNAL_URL at runtime.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign

env:
  REGISTRY: ghcr.io
  OWNER: zyvorai

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aurora-api
            context: ./apps/api
            file: ./apps/api/Dockerfile
          - name: aurora-workers
            context: .
            file: ./apps/workers/Dockerfile
          - name: aurora-web
            context: ./apps/web
            file: ./apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          ref="${GITHUB_REF_NAME}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the Helm chart (OCI)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/aurora --version "$ver" --app-version "$ver" -d dist
          helm push "dist/aurora-${ver}.tgz" oci://ghcr.io/zyvorai/charts

  smoke:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull and start the PoC stack
        if: hashFiles('docker-compose.poc.yml') != ''
        run: |
          export AURORA_VERSION="${GITHUB_REF_NAME#v}"
          docker compose -f docker-compose.poc.yml up -d --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
