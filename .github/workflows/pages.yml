name: pages

# Public site (landing, "Try it", docs, feedback) plus the one-line installers.
# One-time repo setting: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/poc/**"
      - "scripts/build-site.py"
      - "scripts/site-check.mjs"
      - "docker-compose.poc.yml"
      - "CHANGELOG.md"
      - "apps/web/public/screenshots/**"
      - ".github/workflows/pages.yml"
  # Not triggered by `release`: the github-pages environment only deploys from the default branch, so a tag-ref run is refused.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version shown in the footer
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Lint installer
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning scripts/poc/install.sh
          bash -n scripts/poc/install.sh
      - name: Build site
        run: |
          export AURORA_VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          python3 scripts/build-site.py _site
      - name: Check links
        run: node scripts/site-check.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
