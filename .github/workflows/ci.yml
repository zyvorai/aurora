name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # `npm run lint` (next lint) isn't wired up in this repo yet — no
      # ESLint config/dependency, so it prompts interactively. Add it back
      # here once docs/dev-guide.md's lint setup lands.
      - run: npm run build

  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # ruff currently reports ~840 pre-existing style findings across the
      # codebase — not blocking CI on those until a dedicated cleanup lands.
      - run: ruff check .
        continue-on-error: true
      - run: python -m pytest tests/ -v
