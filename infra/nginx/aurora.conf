# TLS termination + reverse proxy for aurora.zyvor.dev.
#
# Path-based routing so the browser only ever talks to one origin (this
# hostname): /api/*, /health, /docs, /openapi.json go to the api container;
# everything else goes to the web (Next.js) container. This means
# NEXT_PUBLIC_API_URL should be built as https://aurora.zyvor.dev/api/v1
# (same-origin), not a separate host:port.
#
# ssl_certificate/ssl_certificate_key point at infra/nginx/certs/ -- see the
# README.md in that directory for what to request from the CA and where to
# put the resulting files. Never commit real key material (see .gitignore).

server {
    listen 80;
    server_name aurora.zyvor.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aurora.zyvor.dev;

    ssl_certificate     /etc/nginx/certs/aurora.zyvor.dev.crt;
    ssl_certificate_key /etc/nginx/certs/aurora.zyvor.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
