apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-api
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aurora
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Built and imported locally via scripts/deploy-k8s.sh (no registry
          # required) -- reuses the same image docker-compose already builds.
          image: docker.io/library/aurora-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: aurora-env
          env:
            # Backing services (postgres/redis/qdrant/neo4j/minio) still
            # run via docker-compose on the same host, not in this cluster --
            # these override the docker-compose-internal service-name URLs
            # (postgres:5432 etc, unreachable from a pod's network namespace)
            # with the host's own address, which those services are bound to
            # publicly. Keep in sync with docker-compose.prod.yml's api service
            # if credentials/ports change there. LLM is OpenAI-compatible
            # (Groq in lab — same key as zyvor-web); no Ollama on the host.
            - name: DATABASE_URL
              value: postgresql+asyncpg://gtm:gtm_dev@175.110.122.71:5432/gtm_platform
            - name: REDIS_URL
              value: redis://175.110.122.71:6379/0
            - name: QDRANT_URL
              value: http://175.110.122.71:6333
            - name: NEO4J_URI
              value: bolt://175.110.122.71:7687
            - name: MINIO_ENDPOINT
              value: 175.110.122.71:9000
            # Cluster is reached through the HTTPS nginx tls-proxy NodePort
            # (k8s/tls-proxy-deployment.yaml, :30443). Keep SSO callback in sync
            # with Keycloak aurora-realm.json redirect URIs.
            - name: SSO_REDIRECT_URI
              value: https://175.110.122.71:30443/api/v1/auth/sso/callback
            - name: FRONTEND_URL
              value: https://175.110.122.71:30443
            - name: SSO_ISSUER
              value: http://175.110.122.71:8180/realms/aurora
            - name: SSO_CLIENT_ID
              value: aurora
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
