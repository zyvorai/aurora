apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-web
  namespace: aurora
  labels:
    app.kubernetes.io/name: aurora
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aurora
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          # NEXT_PUBLIC_API_URL is baked in at build time (Next.js), so this
          # image is built separately from the docker-compose one -- see
          # scripts/deploy-k8s.sh. It points at the HTTPS TLS-proxy entrypoint
          # (k8s/tls-proxy-deployment.yaml, NodePort 30443), not the plain-HTTP
          # api NodePort directly -- serving the page over HTTPS but calling
          # a plain-HTTP API would get the request mixed-content-blocked by
          # the browser.
          image: docker.io/library/aurora-web:k8s-tls
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: aurora-env
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
