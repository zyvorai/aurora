# Production app-layer overlay. Run alongside the backing-infra compose file:
#
#   docker compose -f infra/docker-compose.yml -f docker-compose.prod.yml up -d
#
# Images are named aurora-api / aurora-workers / aurora-web (`name:` below).
# The public HTTPS entrypoint is the K3s TLS proxy (see k8s/), not hypersdk-web.

name: aurora

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    # Credentials below mirror infra/docker-compose.yml's hardcoded postgres/
    # neo4j service definitions -- if you change credentials there, update
    # them here too. Only host is swapped from localhost to the service name.
    environment:
      DATABASE_URL: postgresql+asyncpg://gtm:gtm_dev@postgres:5432/gtm_platform
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      # Bound to localhost only — public HTTPS is the K3s TLS proxy (k8s/),
      # not a reverse proxy in hypersdk-web.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gtm:gtm_dev@postgres:5432/gtm_platform
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_started
    ports:
      # Same reasoning as the api service above -- localhost-only.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
