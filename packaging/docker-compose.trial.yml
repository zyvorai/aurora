# Trial / customer compose — images are pre-loaded from the package
# (docker load / podman load). Does not build from source.
#
#   # Start deps first (shipped in this package):
#   docker compose -f docker-compose.infra.trial.yml up -d
#   docker compose -f docker-compose.trial.yml --env-file .env up -d
#
# Joins the "aurora-trial" network created by docker-compose.infra.trial.yml
# so service DNS names (postgres, redis, …) resolve. If you bring your own
# infra instead, remove the networks: block and point .env URLs at your hosts.

services:
  api:
    image: aurora-api:${AURORA_VERSION:-0.1.0}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gtm:gtm_dev@postgres:5432/gtm_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gtm_dev_neo4j}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gtm_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-gtm_minio_dev}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      AURORA_LICENSE_KEY: ${AURORA_LICENSE_KEY:-}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-true}
    ports:
      - "${AURORA_API_BIND:-127.0.0.1:8000}:8000"
    networks: [aurora-trial]
    restart: unless-stopped

  workers:
    image: aurora-workers:${AURORA_VERSION:-0.1.0}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gtm:gtm_dev@postgres:5432/gtm_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gtm_dev_neo4j}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gtm_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-gtm_minio_dev}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      AURORA_LICENSE_KEY: ${AURORA_LICENSE_KEY:-}
    networks: [aurora-trial]
    restart: unless-stopped

  web:
    image: aurora-web:${AURORA_VERSION:-0.1.0}
    ports:
      - "${AURORA_WEB_BIND:-0.0.0.0:3000}:3000"
    networks: [aurora-trial]
    restart: unless-stopped

networks:
  aurora-trial:
    external: true
    name: aurora-trial
