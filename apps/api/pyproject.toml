[project]
name = "gtm-api"
version = "0.1.0"
description = "AI Technical GTM Agent Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.26.0",
    "redis>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "tiktoken>=0.8.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "weasyprint>=63.0",
    "minio>=7.2.0",
    "structlog>=24.4.0",
    "pypdf>=5.1.0",
    "openpyxl>=3.1.0",
    "youtube-transcript-api>=0.6.0",
    "pyyaml>=6.0.0",
    "cryptography>=43.0.0",
    "arq>=0.26.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
external-mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
