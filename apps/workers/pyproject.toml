[project]
name = "emissary-workers"
version = "0.1.0"
description = "Emissary Workers"
requires-python = ">=3.11"
dependencies = [
    "emissary-api",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_workers"]
