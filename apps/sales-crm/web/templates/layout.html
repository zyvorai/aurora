{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · SalesPulse CRM</title>
  <script>(function(){try{if(localStorage.getItem('crm-theme')!=='dark')document.documentElement.classList.add('light-theme')}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">Sales<span>Pulse</span></a>
    <nav>
      <a href="/" {{if eq .Title "Dashboard"}}class="active"{{end}}>Dashboard</a>
      <a href="/pipeline" {{if eq .Title "Pipeline"}}class="active"{{end}}>Pipeline</a>
      <a href="/deals" {{if eq .Title "Deals"}}class="active"{{end}}>Deals</a>
      <a href="/contacts" {{if eq .Title "Contacts"}}class="active"{{end}}>Contacts</a>
      <a href="/reports" {{if eq .Title "Reports"}}class="active"{{end}}>Reports</a>
    </nav>
    <div class="actions">
      <a href="/deals/new" class="btn btn-primary">+ Deal</a>
      <a href="/contacts/new" class="btn btn-ghost">+ Contact</a>
    </div>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
