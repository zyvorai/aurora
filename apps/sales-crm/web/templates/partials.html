{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · SalesPulse CRM</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">Sales<span>Pulse</span></a>
    <nav>
      <a href="/" class="{{if eq .Title "Dashboard"}}active{{end}}">Dashboard</a>
      <a href="/pipeline" class="{{if eq .Title "Pipeline"}}active{{end}}">Pipeline</a>
      <a href="/deals" class="{{if eq .Title "Deals"}}active{{end}}">Deals</a>
      <a href="/contacts" class="{{if eq .Title "Contacts"}}active{{end}}">Contacts</a>
      <a href="/reports" class="{{if eq .Title "Reports"}}active{{end}}">Reports</a>
    </nav>
    <form class="top-search" action="/deals" method="get">
      <input type="search" name="q" placeholder="Search deals…" aria-label="Search">
    </form>
    <div class="actions">
      <a href="/deals/new" class="btn btn-primary">+ Deal</a>
      <a href="/contacts/new" class="btn btn-ghost">+ Contact</a>
      <a href="/logout" class="btn btn-ghost" title="Sign out">⎋</a>
    </div>
  </header>
  <main class="container">
{{end}}

{{define "footer"}}
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
