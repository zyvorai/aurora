# Aurora Helm chart. Zyvor Production License v1.0: free for non-production use; production needs a commercial
# license (sales@zyvor.dev, see docs/LICENSING.md).
#
# Quick test on any cluster (bundles Postgres + Qdrant, generates secrets):
#   helm install aurora ./charts/aurora -f charts/aurora/values-poc.yaml

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

# Image registry prefix; image tags default to the chart appVersion.
registry: ghcr.io/zyvorai

api:
  image:
    repository: aurora-api
    tag: ""   # empty = chart appVersion
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

web:
  image:
    repository: aurora-web
    tag: ""   # empty = chart appVersion
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
  # The published web image calls a relative /api/v1 and proxies it to the API service at runtime
  # (API_INTERNAL_URL is set by this chart), so no rebuild is needed for any host name.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

workers:
  enabled: true   # PoC mode turns this off (workflows run in the API process)
  image:
    repository: aurora-workers
    tag: ""   # empty = chart appVersion
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

# Connection strings for backing services (Postgres, Redis, Qdrant, Neo4j, MinIO, Ollama).
# These are required — Aurora does not bundle databases in this chart.
env:
  DATABASE_URL: ""
  REDIS_URL: ""
  QDRANT_URL: ""
  NEO4J_URI: ""
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ""
  MINIO_ENDPOINT: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  OLLAMA_BASE_URL: ""
  SECRET_KEY: ""
  FRONTEND_URL: ""
  LLM_PROVIDER: ollama

# LLM settings (used in addition to env above). For OpenAI-compatible APIs set llm.provider=openai and llm.openaiApiKey.
llm:
  provider: ""        # empty = env.LLM_PROVIDER
  openaiApiKey: ""
  openaiBaseUrl: ""
  model: ""
  ollamaBaseUrl: ""   # e.g. http://host.docker.internal:11434/v1 for Ollama on the host

# One-command test mode: bundles Postgres + Qdrant, DEPLOYMENT_PROFILE=minimal, no Neo4j/Redis/MinIO/workers,
# generates SECRET_KEY and the DB password (kept across upgrades). Not for production.
poc:
  enabled: false
  storage: 5Gi
  storageClassName: ""

# Optional: reference an existing Secret instead of inline env above.
existingSecret: ""

ingress:
  enabled: false
  className: ""
  host: ""
  tls: false
  annotations: {}
