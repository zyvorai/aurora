{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurora.fullname" . }}-env
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  QDRANT_URL: {{ .Values.env.QDRANT_URL | quote }}
  NEO4J_URI: {{ .Values.env.NEO4J_URI | quote }}
  NEO4J_USER: {{ .Values.env.NEO4J_USER | quote }}
  NEO4J_PASSWORD: {{ .Values.env.NEO4J_PASSWORD | quote }}
  MINIO_ENDPOINT: {{ .Values.env.MINIO_ENDPOINT | quote }}
  MINIO_ACCESS_KEY: {{ .Values.env.MINIO_ACCESS_KEY | quote }}
  MINIO_SECRET_KEY: {{ .Values.env.MINIO_SECRET_KEY | quote }}
  OLLAMA_BASE_URL: {{ .Values.env.OLLAMA_BASE_URL | quote }}
  SECRET_KEY: {{ .Values.env.SECRET_KEY | quote }}
  FRONTEND_URL: {{ .Values.env.FRONTEND_URL | quote }}
  LLM_PROVIDER: {{ .Values.env.LLM_PROVIDER | quote }}
{{- end }}
