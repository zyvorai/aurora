{{- if not .Values.existingSecret }}
{{- $poc := .Values.poc.enabled }}
{{- $fn := include "aurora.fullname" . }}
{{- /* Generate each PoC credential ONCE and use the same value in both Secrets below (randAlphaNum differs per call). */}}
{{- $pocSecretKey := include "aurora.pocSecretValue" (dict "root" . "key" "SECRET_KEY") }}
{{- $dbPass := include "aurora.pocSecretValue" (dict "root" . "key" "POSTGRES_PASSWORD") }}
{{- $secretKey := ternary $pocSecretKey .Values.env.SECRET_KEY $poc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-env
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $poc }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://aurora:%s@%s-postgres:5432/aurora" $dbPass $fn | quote }}
  QDRANT_URL: {{ printf "http://%s-qdrant:6333" $fn | quote }}
  DEPLOYMENT_PROFILE: "minimal"
  SEED_DEFAULT_ADMIN: "true"
  {{- else }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  QDRANT_URL: {{ .Values.env.QDRANT_URL | quote }}
  NEO4J_URI: {{ .Values.env.NEO4J_URI | quote }}
  NEO4J_USER: {{ .Values.env.NEO4J_USER | quote }}
  NEO4J_PASSWORD: {{ .Values.env.NEO4J_PASSWORD | quote }}
  MINIO_ENDPOINT: {{ .Values.env.MINIO_ENDPOINT | quote }}
  MINIO_ACCESS_KEY: {{ .Values.env.MINIO_ACCESS_KEY | quote }}
  MINIO_SECRET_KEY: {{ .Values.env.MINIO_SECRET_KEY | quote }}
  {{- end }}
  OLLAMA_BASE_URL: {{ .Values.llm.ollamaBaseUrl | default .Values.env.OLLAMA_BASE_URL | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  FRONTEND_URL: {{ .Values.env.FRONTEND_URL | quote }}
  LLM_PROVIDER: {{ .Values.llm.provider | default .Values.env.LLM_PROVIDER | quote }}
  {{- with .Values.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.openaiBaseUrl }}
  OPENAI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.model }}
  OPENAI_MODEL: {{ . | quote }}
  LLM_SINGLE_MODEL: {{ . | quote }}
  OLLAMA_DEFAULT_MODEL: {{ . | quote }}
  {{- end }}
{{- if $poc }}
---
# Generated PoC credentials, kept across `helm upgrade` (read back via lookup in aurora.pocSecretValue).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurora.fullname" . }}-poc
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $pocSecretKey | quote }}
  POSTGRES_PASSWORD: {{ $dbPass | quote }}
{{- end }}
{{- end }}
